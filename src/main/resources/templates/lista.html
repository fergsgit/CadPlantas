<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Plantas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h1 class="mb-4">🌱 Lista de Plantas</h1>

    <!-- Mensagem de sucesso -->
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>

    <!-- Tabela de plantas -->
    <table class="table table-striped table-bordered">
        <thead class="table-success">
            <tr>
                <th>Espécie</th>
                <th>Origem</th>
                <th>Cuidados</th>
                <th>Tipos</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="planta : ${plantas}">
                <td th:text="${planta.especie}"></td>
                <td th:text="${planta.origem}"></td>
                <td th:text="${planta.cuidados}"></td>
                <td th:text="${planta.tipos}"></td>
                <td>
                    <a th:href="@{'/excluir/' + ${planta.especie}}" 
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Tem certeza que deseja excluir esta planta?')">
                       Excluir
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Voltar</a>

</body>
</html>

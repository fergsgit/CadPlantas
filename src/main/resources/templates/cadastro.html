<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport para responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Plantas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Cadastro de Plantas</h1>

    <!-- Mensagem de sucesso ou erro -->
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <!-- Formulário usando Thymeleaf -->
    <form th:action="@{/salvar}" th:object="${cadplanta}" method="post">
        <div class="mb-3">
            <label for="especie" class="form-label">Espécie:</label>
            <input type="text" th:field="*{especie}" id="especie" placeholder="Digite a espécie" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="origem" class="form-label">Origem:</label>
            <input type="text" th:field="*{origem}" id="origem" placeholder="Digite a origem" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="cuidados" class="form-label">Cuidados:</label>
            <textarea th:field="*{cuidados}" id="cuidados" placeholder="Descreva os cuidados" class="form-control" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label for="tipos" class="form-label">Tipos:</label>
            <input type="text" th:field="*{tipos}" id="tipos" placeholder="Digite o tipo da planta" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Salvar Planta</button>
        <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
